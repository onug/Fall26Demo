<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1240 880" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><rect width="100%" height="100%" fill="#ffffff"/>
    <defs>
      <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a6700"/></marker>
      <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker>
      <marker id="aK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f3542"/></marker>
    </defs>

    <rect x="40" y="14" width="1160" height="50" rx="10" fill="#eef3fb" stroke="#2b4c9b" stroke-width="1.4"/>
    <text x="620" y="35" text-anchor="middle" font-size="13" font-weight="700">Human Oversight &amp; Governance</text>
    <text x="620" y="52" text-anchor="middle" font-size="10.5" fill="#3a4254">decision rights · approval of personas &amp; task sets · change-stop authority · one oversight model across every domain</text>

    <text x="620" y="92" text-anchor="middle" font-size="11" font-weight="700" fill="#5a6375" letter-spacing=".08em">DOMAIN PERSONAS — EVERY INFRASTRUCTURE DOMAIN PLUGS IN THE SAME WAY</text>

    <rect x="40" y="104" width="184" height="158" rx="10" fill="#eee8f7" stroke="#7d5fb2" stroke-width="1.8"/>
    <text x="132" y="126" text-anchor="middle" font-size="12" font-weight="700">NOC</text>
    <text x="132" y="140" text-anchor="middle" font-size="9" fill="#5b4a80" font-weight="700">Network Ops — WG2 v0.6</text>
    <g font-size="9" fill="#5a6375">
      <text x="132" y="160" text-anchor="middle">persona: autonomy · models ·</text>
      <text x="132" y="172" text-anchor="middle">estate under management</text>
      <text x="132" y="190" text-anchor="middle">ops loop 1–6</text>
      <text x="132" y="204" text-anchor="middle" font-weight="700" fill="#3a4254">step 4 = Verify Gate</text>
      <text x="132" y="222" text-anchor="middle" font-style="italic">stop the bleeding —</text>
      <text x="132" y="234" text-anchor="middle" font-style="italic">protect revenue</text>
    </g>

    <rect x="238" y="104" width="184" height="158" rx="10" fill="#eee8f7" stroke="#7d5fb2" stroke-width="1.8"/>
    <text x="330" y="126" text-anchor="middle" font-size="12" font-weight="700">SOC</text>
    <text x="330" y="140" text-anchor="middle" font-size="9" fill="#5b4a80" font-weight="700">Security Ops — WG3 v0.6</text>
    <g font-size="9" fill="#5a6375">
      <text x="330" y="160" text-anchor="middle">persona: autonomy · models ·</text>
      <text x="330" y="172" text-anchor="middle">estate under watch</text>
      <text x="330" y="190" text-anchor="middle">ops loop 1–6</text>
      <text x="330" y="204" text-anchor="middle" font-weight="700" fill="#3a4254">step 4 = Decide Gate</text>
      <text x="330" y="222" text-anchor="middle" font-style="italic">observe &amp; trace —</text>
      <text x="330" y="234" text-anchor="middle" font-style="italic">evidence first</text>
    </g>

    <rect x="436" y="104" width="184" height="158" rx="10" fill="#f6f3fb" stroke="#a292c8" stroke-width="1.2" stroke-dasharray="6 4"/>
    <text x="528" y="126" text-anchor="middle" font-size="12" font-weight="700" fill="#5b4a80">Cloud &amp; Platform Ops</text>
    <g font-size="9" fill="#7a6c9a">
      <text x="528" y="150" text-anchor="middle">same template:</text>
      <text x="528" y="164" text-anchor="middle">persona → loop → plane</text>
      <text x="528" y="190" text-anchor="middle" font-style="italic">capacity flex · cost posture ·</text>
      <text x="528" y="202" text-anchor="middle" font-style="italic">IaC &amp; config drift</text>
    </g>

    <rect x="634" y="104" width="184" height="158" rx="10" fill="#f6f3fb" stroke="#a292c8" stroke-width="1.2" stroke-dasharray="6 4"/>
    <text x="726" y="126" text-anchor="middle" font-size="12" font-weight="700" fill="#5b4a80">DevOps / CI-CD</text>
    <g font-size="9" fill="#7a6c9a">
      <text x="726" y="150" text-anchor="middle">same template:</text>
      <text x="726" y="164" text-anchor="middle">persona → loop → plane</text>
      <text x="726" y="190" text-anchor="middle" font-style="italic">build · test · deploy ·</text>
      <text x="726" y="202" text-anchor="middle" font-style="italic">rollback discipline</text>
    </g>

    <rect x="832" y="104" width="184" height="158" rx="10" fill="#f6f3fb" stroke="#a292c8" stroke-width="1.2" stroke-dasharray="6 4"/>
    <text x="924" y="126" text-anchor="middle" font-size="12" font-weight="700" fill="#5b4a80">Data &amp; Storage Ops</text>
    <g font-size="9" fill="#7a6c9a">
      <text x="924" y="150" text-anchor="middle">same template:</text>
      <text x="924" y="164" text-anchor="middle">persona → loop → plane</text>
      <text x="924" y="190" text-anchor="middle" font-style="italic">capacity · lifecycle ·</text>
      <text x="924" y="202" text-anchor="middle" font-style="italic">protection &amp; recovery</text>
    </g>

    <rect x="1030" y="104" width="170" height="158" rx="10" fill="#fbfbfd" stroke="#c3b3d6" stroke-width="1.2" stroke-dasharray="3 4"/>
    <text x="1115" y="126" text-anchor="middle" font-size="12" font-weight="700" fill="#8a7ba8">…any domain</text>
    <g font-size="9" fill="#9a8fb5">
      <text x="1115" y="150" text-anchor="middle">facilities · OT · FinOps ·</text>
      <text x="1115" y="162" text-anchor="middle">service desk · business ops</text>
      <text x="1115" y="188" text-anchor="middle" font-style="italic">define a persona,</text>
      <text x="1115" y="200" text-anchor="middle" font-style="italic">plug into the plane</text>
    </g>

    <path d="M 132 262 C 132 300, 330 300, 330 262" fill="none" stroke="#2f3542" stroke-width="1.6" marker-end="url(#aK)" marker-start="url(#aK)"/>
    <text x="231" y="296" text-anchor="middle" font-size="8.5" fill="#2f3542" stroke="#f6f7f9" stroke-width="3" paint-order="stroke" font-weight="600">cross-domain cooperation — always through the plane; never around it</text>

    <line x1="132" y1="304" x2="132" y2="330" stroke="#9a6700" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#aG)"/>
    <line x1="330" y1="304" x2="330" y2="330" stroke="#9a6700" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#aG)"/>
    <line x1="528" y1="262" x2="528" y2="330" stroke="#9a6700" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#aG)"/>
    <line x1="726" y1="262" x2="726" y2="330" stroke="#9a6700" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#aG)"/>
    <line x1="924" y1="262" x2="924" y2="330" stroke="#9a6700" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#aG)"/>
    <line x1="1115" y1="262" x2="1115" y2="330" stroke="#9a6700" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#aG)"/>

    <rect x="40" y="334" width="1160" height="190" rx="14" fill="#fdf8ec" stroke="#9a6700" stroke-width="2.2"/>
    <text x="620" y="360" text-anchor="middle" font-size="14.5" font-weight="800" fill="#7a5300">THE AGENTIC CONTROL PLANE — WG1 v0.2</text>
    <text x="620" y="376" text-anchor="middle" font-size="10" fill="#7a5300" font-style="italic">the shared Access Enforcement &amp; Audit layer every persona runs on · federated, no über-controller · outside agent control and influence · every hop mutually authenticated</text>

    <rect x="58" y="390" width="270" height="112" rx="9" fill="#e7f5ee" stroke="#1a7f4e" stroke-width="1.5"/>
    <text x="193" y="410" text-anchor="middle" font-size="11" font-weight="700" fill="#135f3b">Agent Trust Fabric ★</text>
    <g font-size="9" fill="#1f5138">
      <text x="70" y="428">• non-human identity · attestation</text>
      <text x="70" y="442">• gateway-held credentials — agents</text>
      <text x="78" y="454">never touch secrets</text>
      <text x="70" y="468">• per-step scoped tokens · least privilege</text>
      <text x="70" y="482">• deprovisioning first · kill-on-drift</text>
    </g>

    <rect x="344" y="390" width="270" height="112" rx="9" fill="#fff" stroke="#c9a86a" stroke-width="1.2"/>
    <text x="479" y="410" text-anchor="middle" font-size="11" font-weight="700" fill="#7a5300">Registry, Personas &amp; BOM</text>
    <g font-size="9" fill="#3a4254">
      <text x="356" y="428">• the persona record: autonomy, model,</text>
      <text x="364" y="440">estate, approved task set</text>
      <text x="356" y="454">• agent bill of materials · data classes</text>
      <text x="356" y="468">• rights &amp; normal-behavior spec</text>
      <text x="364" y="480">(open gap — vendor challenge)</text>
    </g>

    <rect x="630" y="390" width="270" height="112" rx="9" fill="#fff" stroke="#c9a86a" stroke-width="1.2"/>
    <text x="765" y="410" text-anchor="middle" font-size="11" font-weight="700" fill="#7a5300">Runtime Supervision</text>
    <g font-size="9" fill="#3a4254">
      <text x="642" y="428">• policy check on every message &amp; call</text>
      <text x="642" y="442">• injection filtering (prompt · inferred ·</text>
      <text x="650" y="454">hidden-instruction)</text>
      <text x="642" y="468">• composite-authority detection</text>
      <text x="642" y="482">• quarantine · immutable audit journal</text>
    </g>

    <rect x="916" y="390" width="270" height="112" rx="9" fill="#fff" stroke="#c9a86a" stroke-width="1.2"/>
    <text x="1051" y="410" text-anchor="middle" font-size="11" font-weight="700" fill="#7a5300">Private Open Router ★</text>
    <g font-size="9" fill="#3a4254">
      <text x="928" y="428">• every model call routed by cost · risk ·</text>
      <text x="936" y="440">sovereignty · certification</text>
      <text x="928" y="454">• right-size the model per task</text>
      <text x="928" y="468">• spend caps · usage attribution —</text>
      <text x="936" y="480">the AI FinOps lever for every domain</text>
    </g>

    <line x1="193" y1="524" x2="193" y2="552" stroke="#2b6cb0" stroke-width="1.5" marker-start="url(#aB)" marker-end="url(#aB)"/>
    <line x1="479" y1="524" x2="479" y2="552" stroke="#2b6cb0" stroke-width="1.5" marker-start="url(#aB)" marker-end="url(#aB)"/>
    <line x1="765" y1="524" x2="765" y2="552" stroke="#2b6cb0" stroke-width="1.5" marker-start="url(#aB)" marker-end="url(#aB)"/>
    <line x1="1051" y1="524" x2="1051" y2="552" stroke="#2b6cb0" stroke-width="1.5" marker-start="url(#aB)" marker-end="url(#aB)"/>

    <rect x="40" y="556" width="272" height="118" rx="10" fill="#fbe9e7" stroke="#b3261e" stroke-width="1.2"/>
    <text x="176" y="576" text-anchor="middle" font-size="11" font-weight="700" fill="#8c1d17">Enterprise Identity Systems</text>
    <g font-size="9" fill="#8c1d17">
      <text x="176" y="594" text-anchor="middle">air-gapped from agents —</text>
      <text x="176" y="606" text-anchor="middle">identity flows FROM the plane;</text>
      <text x="176" y="618" text-anchor="middle">agents can never reach in to</text>
      <text x="176" y="630" text-anchor="middle">promote or mint authority</text>
      <text x="176" y="650" text-anchor="middle" font-style="italic">"try to get yourself promoted"</text>
    </g>

    <rect x="326" y="556" width="272" height="118" rx="10" fill="#fdf6dd" stroke="#c9b45e" stroke-width="1.3"/>
    <text x="462" y="576" text-anchor="middle" font-size="11" font-weight="700">Telemetry · Sources of Truth · Rulesets</text>
    <g font-size="9" fill="#5a6375">
      <text x="462" y="594" text-anchor="middle">per-domain, read-only to agents —</text>
      <text x="462" y="606" text-anchor="middle">what the estate is, what it should be,</text>
      <text x="462" y="618" text-anchor="middle">and the rules that judge the difference</text>
      <text x="462" y="638" text-anchor="middle" font-style="italic">an agent can never rewrite</text>
      <text x="462" y="650" text-anchor="middle" font-style="italic">its own baselines or rules</text>
    </g>

    <rect x="612" y="556" width="272" height="118" rx="10" fill="#f3f6fb" stroke="#aebad2" stroke-width="1.2"/>
    <text x="748" y="576" text-anchor="middle" font-size="11" font-weight="700">Tools &amp; Enterprise Data</text>
    <g font-size="9" fill="#5a6375">
      <text x="748" y="594" text-anchor="middle">reached only through governed</text>
      <text x="748" y="606" text-anchor="middle">MCP gateways the plane authorizes —</text>
      <text x="748" y="618" text-anchor="middle">controllers &amp; enforcement points are</text>
      <text x="748" y="630" text-anchor="middle">the only paths that touch infrastructure</text>
      <text x="748" y="650" text-anchor="middle" font-style="italic">no direct agent-to-device paths</text>
    </g>

    <rect x="898" y="556" width="302" height="118" rx="10" fill="#f3f6fb" stroke="#aebad2" stroke-width="1.2"/>
    <text x="1049" y="576" text-anchor="middle" font-size="11" font-weight="700">Model Estate — hybrid by design</text>
    <g font-size="9" fill="#5a6375">
      <text x="1049" y="594" text-anchor="middle">frontier (closed) · open-weight · private on-prem</text>
      <text x="1049" y="606" text-anchor="middle">certified before use · version-pinned ·</text>
      <text x="1049" y="618" text-anchor="middle">rollback on regression</text>
      <text x="1049" y="638" text-anchor="middle" font-style="italic">good models think &amp; orchestrate,</text>
      <text x="1049" y="650" text-anchor="middle" font-style="italic">cheap models do the grunt work</text>
    </g>

    <rect x="40" y="694" width="1160" height="78" rx="10" fill="#fbfcfe" stroke="#e2e5ec"/>
    <text x="56" y="714" font-size="10.5" font-weight="700">Legend</text>
    <g font-size="9.5" fill="#3a4254">
      <rect x="56" y="724" width="13" height="13" rx="3" fill="#eee8f7" stroke="#7d5fb2"/>
      <text x="75" y="734">Domain persona (solid = defined by WG2/WG3; dashed = same template, future domains)</text>
      <rect x="530" y="724" width="13" height="13" rx="3" fill="#fdf8ec" stroke="#9a6700"/>
      <text x="549" y="734">The shared control plane (WG1)</text>
      <rect x="750" y="724" width="13" height="13" rx="3" fill="#fdf6dd" stroke="#c9b45e"/>
      <text x="769" y="734">Governed resources — read-only or gateway-mediated</text>
      <line x1="56" y1="752" x2="92" y2="752" stroke="#9a6700" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#aG)"/>
      <text x="100" y="756">Enrollment &amp; mediation — every persona, every action</text>
      <line x1="420" y1="752" x2="456" y2="752" stroke="#2f3542" stroke-width="1.6" marker-end="url(#aK)" marker-start="url(#aK)"/>
      <text x="464" y="756">Cross-domain agent cooperation — through the plane, never around it</text>
      <line x1="880" y1="752" x2="916" y2="752" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#aB)"/>
      <text x="924" y="756">Governed access to identity, data, tools &amp; models</text>
    </g>

    <text x="40" y="800" font-size="10" fill="#8a93a5">The point of the picture: the control plane is the enabler of ALL agentic infrastructure management. NOC and SOC are simply the first two personas — any domain becomes agentic by defining a persona</text>
    <text x="40" y="816" font-size="10" fill="#8a93a5">(autonomy · models · estate) and plugging into the plane, inheriting identity, enforcement, audit, and model routing without rebuilding them. Build the enforcement machinery once; reuse it everywhere.</text>
    <text x="40" y="838" font-size="10" fill="#b0894a" font-style="italic">Draft v0.2 · Composite of WG1 Agentic Control Plane v0.2 (ratified 7/28), WG2 NOC v0.6, and WG3 SOC v0.6 · For the cross-WG alignment discussion.</text>
  </svg>
