<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="#ffffff"/>
      <defs>
        <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#70A228"/></marker>
        <marker id="arrGrey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#585858"/></marker>
      </defs>

      <!-- Governance band -->
      <rect x="30" y="20" width="1140" height="58" rx="8" fill="#0F1D2A"/>
      <text x="600" y="46" text-anchor="middle" font-size="15" font-weight="700" fill="#8FC73E">Human Oversight &amp; Governance</text>
      <text x="600" y="65" text-anchor="middle" font-size="12" fill="#9B9B9B">Decision rights · approval of personas &amp; task sets · change-stop authority · one oversight model, every domain</text>

      <!-- Domain personas label -->
      <text x="600" y="98" text-anchor="middle" font-size="11.5" font-weight="700" fill="#585858" letter-spacing="0.06em">DOMAIN PERSONAS — EVERY DOMAIN PLUGS IN THE SAME WAY</text>

      <!-- Persona boxes -->
      <g>
        <rect x="44" y="110" width="170" height="140" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/>
        <text x="129" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#000000">NOC</text>
        <text x="129" y="152" text-anchor="middle" font-size="10.5" fill="#585858">Network Ops · WG2 v0.6</text>
        <text x="129" y="178" text-anchor="middle" font-size="11" fill="#2C2C2C">Persona: autonomy,</text>
        <text x="129" y="193" text-anchor="middle" font-size="11" fill="#2C2C2C">model, estate managed</text>
        <text x="129" y="222" text-anchor="middle" font-size="10.5" font-style="italic" fill="#585858">"stop the bleeding,</text>
        <text x="129" y="236" text-anchor="middle" font-size="10.5" font-style="italic" fill="#585858">protect revenue"</text>
      </g>

      <g>
        <rect x="228" y="110" width="170" height="140" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/>
        <text x="313" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#000000">SOC</text>
        <text x="313" y="152" text-anchor="middle" font-size="10.5" fill="#585858">Security Ops · WG3 v0.6</text>
        <text x="313" y="178" text-anchor="middle" font-size="11" fill="#2C2C2C">Persona: autonomy,</text>
        <text x="313" y="193" text-anchor="middle" font-size="11" fill="#2C2C2C">model, estate watched</text>
        <text x="313" y="222" text-anchor="middle" font-size="10.5" font-style="italic" fill="#585858">"observe &amp; trace,</text>
        <text x="313" y="236" text-anchor="middle" font-size="10.5" font-style="italic" fill="#585858">evidence first"</text>
      </g>

      <g>
        <rect x="412" y="110" width="170" height="140" rx="8" fill="#FFFFFF" stroke="#DADBDD" stroke-width="1.4" stroke-dasharray="6 4"/>
        <text x="497" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#585858">Cloud &amp; Platform</text>
        <text x="497" y="156" text-anchor="middle" font-size="10.5" fill="#585858">Ops</text>
        <text x="497" y="182" text-anchor="middle" font-size="10.5" fill="#8a93a5">same template:</text>
        <text x="497" y="196" text-anchor="middle" font-size="10.5" fill="#8a93a5">persona &#8594; loop &#8594; plane</text>
        <text x="497" y="222" text-anchor="middle" font-size="10" font-style="italic" fill="#8a93a5">capacity · cost ·</text>
        <text x="497" y="236" text-anchor="middle" font-size="10" font-style="italic" fill="#8a93a5">config drift</text>
      </g>

      <g>
        <rect x="596" y="110" width="170" height="140" rx="8" fill="#FFFFFF" stroke="#DADBDD" stroke-width="1.4" stroke-dasharray="6 4"/>
        <text x="681" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#585858">DevOps / CI-CD</text>
        <text x="681" y="182" text-anchor="middle" font-size="10.5" fill="#8a93a5">same template:</text>
        <text x="681" y="196" text-anchor="middle" font-size="10.5" fill="#8a93a5">persona &#8594; loop &#8594; plane</text>
        <text x="681" y="222" text-anchor="middle" font-size="10" font-style="italic" fill="#8a93a5">build · test ·</text>
        <text x="681" y="236" text-anchor="middle" font-size="10" font-style="italic" fill="#8a93a5">deploy · rollback</text>
      </g>

      <g>
        <rect x="780" y="110" width="170" height="140" rx="8" fill="#FFFFFF" stroke="#DADBDD" stroke-width="1.4" stroke-dasharray="6 4"/>
        <text x="865" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#585858">Data &amp; Storage</text>
        <text x="865" y="156" text-anchor="middle" font-size="10.5" fill="#585858">Ops</text>
        <text x="865" y="182" text-anchor="middle" font-size="10.5" fill="#8a93a5">same template:</text>
        <text x="865" y="196" text-anchor="middle" font-size="10.5" fill="#8a93a5">persona &#8594; loop &#8594; plane</text>
        <text x="865" y="222" text-anchor="middle" font-size="10" font-style="italic" fill="#8a93a5">capacity · lifecycle ·</text>
        <text x="865" y="236" text-anchor="middle" font-size="10" font-style="italic" fill="#8a93a5">recovery</text>
      </g>

      <g>
        <rect x="964" y="110" width="170" height="140" rx="8" fill="#FBFBFD" stroke="#DADBDD" stroke-width="1.2" stroke-dasharray="3 4"/>
        <text x="1049" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#8a93a5">…any domain</text>
        <text x="1049" y="164" text-anchor="middle" font-size="10" fill="#9a8fb5">facilities · OT · FinOps ·</text>
        <text x="1049" y="178" text-anchor="middle" font-size="10" fill="#9a8fb5">service desk</text>
        <text x="1049" y="206" text-anchor="middle" font-size="10" font-style="italic" fill="#9a8fb5">define a persona,</text>
        <text x="1049" y="220" text-anchor="middle" font-size="10" font-style="italic" fill="#9a8fb5">plug into the plane</text>
      </g>

      <!-- Cross-domain cooperation note -->
      <text x="221" y="272" text-anchor="middle" font-size="10.5" fill="#000000" stroke="#F4F4F4" stroke-width="3" paint-order="stroke" font-weight="600">cross-domain cooperation (NOC &#8644; SOC) — always through the plane, never around it</text>

      <!-- Enrollment arrows: persona -> plane -->
      <line x1="129" y1="250" x2="129" y2="300" stroke="#70A228" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrGreen)"/>
      <line x1="313" y1="250" x2="313" y2="300" stroke="#70A228" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrGreen)"/>
      <line x1="497" y1="250" x2="497" y2="300" stroke="#70A228" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrGreen)"/>
      <line x1="681" y1="250" x2="681" y2="300" stroke="#70A228" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrGreen)"/>
      <line x1="865" y1="250" x2="865" y2="300" stroke="#70A228" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrGreen)"/>
      <line x1="1049" y1="250" x2="1049" y2="300" stroke="#70A228" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrGreen)"/>
      <text x="600" y="294" text-anchor="middle" font-size="10.5" fill="#70A228" stroke="#F4F4F4" stroke-width="4" paint-order="stroke" font-weight="700">enrollment &amp; mediation — every persona, every action</text>

      <!-- PLANE frame -->
      <rect x="30" y="300" width="1140" height="248" rx="10" fill="#FFFFFF" stroke="#70A228" stroke-width="2.2"/>
      <text x="600" y="326" text-anchor="middle" font-size="16" font-weight="800" fill="#70A228">THE AGENTIC CONTROL PLANE — WG1 v0.2</text>
      <text x="600" y="344" text-anchor="middle" font-size="11.5" fill="#585858" font-style="italic">federated · no über-controller · outside agent control · every hop mutually authenticated</text>

      <g>
        <rect x="52" y="360" width="260" height="176" rx="8" fill="#FFFFFF" stroke="#70A228" stroke-width="1.6"/>
        <text x="182" y="384" text-anchor="middle" font-size="13.5" font-weight="700" fill="#000000">&#9733; Agent Trust Fabric</text>
        <text x="70" y="410" font-size="12" fill="#2C2C2C">• Non-human identity, attested</text>
        <text x="70" y="432" font-size="12" fill="#2C2C2C">• Agents never touch secrets</text>
        <text x="70" y="454" font-size="12" fill="#2C2C2C">• Scoped tokens, least privilege</text>
        <text x="70" y="476" font-size="12" fill="#2C2C2C">• Deprovision first, kill-on-drift</text>
      </g>

      <g>
        <rect x="322" y="360" width="260" height="176" rx="8" fill="#FFFFFF" stroke="#DADBDD" stroke-width="1.3"/>
        <text x="452" y="384" text-anchor="middle" font-size="13.5" font-weight="700" fill="#000000">Registry, Personas &amp; BOM</text>
        <text x="340" y="410" font-size="12" fill="#2C2C2C">• Autonomy, model, estate,</text>
        <text x="350" y="426" font-size="12" fill="#2C2C2C">approved tasks — on record</text>
        <text x="340" y="448" font-size="12" fill="#2C2C2C">• Agent bill of materials</text>
        <text x="340" y="470" font-size="12" fill="#F58220">• Rights spec: an open gap</text>
      </g>

      <g>
        <rect x="592" y="360" width="260" height="176" rx="8" fill="#FFFFFF" stroke="#DADBDD" stroke-width="1.3"/>
        <text x="722" y="384" text-anchor="middle" font-size="13.5" font-weight="700" fill="#000000">Runtime Supervision</text>
        <text x="610" y="410" font-size="12" fill="#2C2C2C">• Policy check on every call</text>
        <text x="610" y="432" font-size="12" fill="#2C2C2C">• Filters all injection types</text>
        <text x="610" y="454" font-size="12" fill="#2C2C2C">• Detects composite risk</text>
        <text x="610" y="476" font-size="12" fill="#2C2C2C">• Quarantine, immutable log</text>
      </g>

      <g>
        <rect x="862" y="360" width="260" height="176" rx="8" fill="#FFFFFF" stroke="#70A228" stroke-width="1.6"/>
        <text x="992" y="384" text-anchor="middle" font-size="13.5" font-weight="700" fill="#000000">&#9733; Private Open Router</text>
        <text x="880" y="410" font-size="12" fill="#2C2C2C">• Cost, risk, sovereignty</text>
        <text x="892" y="426" font-size="12" fill="#2C2C2C">routing per model call</text>
        <text x="880" y="448" font-size="12" fill="#2C2C2C">• Right-sized model per task</text>
        <text x="880" y="470" font-size="12" fill="#2C2C2C">• Spend caps, usage tracked</text>
      </g>

      <!-- Governed-access arrows: plane -> resources -->
      <line x1="182" y1="536" x2="182" y2="588" stroke="#585858" stroke-width="1.5" marker-end="url(#arrGrey)"/>
      <line x1="452" y1="536" x2="452" y2="588" stroke="#585858" stroke-width="1.5" marker-end="url(#arrGrey)"/>
      <line x1="722" y1="536" x2="722" y2="588" stroke="#585858" stroke-width="1.5" marker-end="url(#arrGrey)"/>
      <line x1="992" y1="536" x2="992" y2="588" stroke="#585858" stroke-width="1.5" marker-end="url(#arrGrey)"/>
      <text x="600" y="576" text-anchor="middle" font-size="10.5" fill="#585858" stroke="#FFFFFF" stroke-width="4" paint-order="stroke" font-weight="600">governed access — identity, data, tools &amp; models</text>

      <!-- Governed resources row -->
      <g>
        <rect x="52" y="592" width="260" height="110" rx="8" fill="#FFFFFF" stroke="#F58220" stroke-width="1" stroke-dasharray="0"/>
        <rect x="52" y="592" width="4" height="110" fill="#F58220"/>
        <text x="70" y="616" font-size="13" font-weight="700" fill="#000000">Enterprise Identity Systems</text>
        <text x="70" y="640" font-size="11.5" fill="#2C2C2C">Air-gapped from agents.</text>
        <text x="70" y="658" font-size="11.5" fill="#2C2C2C">Identity flows out, never in —</text>
        <text x="70" y="676" font-size="11.5" fill="#2C2C2C">no self-promotion.</text>
      </g>

      <g>
        <rect x="322" y="592" width="260" height="110" rx="8" fill="#FFFFFF" stroke="#F58220" stroke-width="1"/>
        <rect x="322" y="592" width="4" height="110" fill="#F58220"/>
        <text x="340" y="616" font-size="13" font-weight="700" fill="#000000">Telemetry, Sources of Truth</text>
        <text x="340" y="632" font-size="13" font-weight="700" fill="#000000">&amp; Rulesets</text>
        <text x="340" y="656" font-size="11.5" fill="#2C2C2C">Read-only to agents — rules</text>
        <text x="340" y="674" font-size="11.5" fill="#2C2C2C">can't be self-rewritten.</text>
      </g>

      <g>
        <rect x="592" y="592" width="260" height="110" rx="8" fill="#FFFFFF" stroke="#F58220" stroke-width="1"/>
        <rect x="592" y="592" width="4" height="110" fill="#F58220"/>
        <text x="610" y="616" font-size="13" font-weight="700" fill="#000000">Tools &amp; Enterprise Data</text>
        <text x="610" y="640" font-size="11.5" fill="#2C2C2C">Only via governed MCP</text>
        <text x="610" y="658" font-size="11.5" fill="#2C2C2C">gateways — no direct</text>
        <text x="610" y="676" font-size="11.5" fill="#2C2C2C">agent-to-device path.</text>
      </g>

      <g>
        <rect x="862" y="592" width="260" height="110" rx="8" fill="#FFFFFF" stroke="#F58220" stroke-width="1"/>
        <rect x="862" y="592" width="4" height="110" fill="#F58220"/>
        <text x="880" y="616" font-size="13" font-weight="700" fill="#000000">Model Estate</text>
        <text x="880" y="640" font-size="11.5" fill="#2C2C2C">Hybrid by design — certified,</text>
        <text x="880" y="658" font-size="11.5" fill="#2C2C2C">version-pinned, auto-rollback</text>
        <text x="880" y="676" font-size="11.5" fill="#2C2C2C">on regression.</text>
      </g>

      <!-- Legend -->
      <rect x="30" y="722" width="1140" height="108" rx="8" fill="#FFFFFF" stroke="#E8E8E8" stroke-width="1.2"/>
      <text x="46" y="744" font-size="11.5" font-weight="700" fill="#000000">Legend</text>
      <g font-size="11" fill="#2C2C2C">
        <rect x="46" y="754" width="20" height="12" rx="2" fill="#FFFFFF" stroke="#000000" stroke-width="1.4"/>
        <text x="72" y="764">Solid persona — defined today (WG2, WG3)</text>
        <rect x="366" y="754" width="20" height="12" rx="2" fill="#FFFFFF" stroke="#DADBDD" stroke-width="1.2" stroke-dasharray="4 3"/>
        <text x="392" y="764">Dashed persona — same template, future domain</text>
        <rect x="46" y="778" width="20" height="12" rx="2" fill="#FFFFFF" stroke="#F58220"/>
        <text x="72" y="788">Governed resource — agents reach it only as policy allows</text>
        <line x1="366" y1="784" x2="386" y2="784" stroke="#70A228" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrGreen)"/>
        <text x="392" y="788">Enrollment &amp; mediation — every persona, every action</text>
        <line x1="46" y1="805" x2="66" y2="805" stroke="#585858" stroke-width="1.5" marker-end="url(#arrGrey)"/>
        <text x="72" y="809">Governed access — the plane to identity, data, tools, models</text>
        <text x="700" y="809" font-weight="700" fill="#70A228">&#9733;</text>
        <text x="712" y="809">= the two components this map calls distinctive</text>
      </g>

      <text x="30" y="856" font-size="11.5" fill="#585858">The control plane is the enabler of every agentic domain. NOC and SOC are simply the first two personas — any domain becomes agentic by</text>
      <text x="30" y="874" font-size="11.5" fill="#585858">defining a persona and plugging into the plane, inheriting identity, enforcement, audit, and model routing without rebuilding them.</text>
      <text x="30" y="892" font-size="11" font-style="italic" fill="#b0894a">Draft v0.2 · Composite of WG1 v0.2, WG2 NOC v0.6, WG3 SOC v0.6 · redrawn in ONUG design language for this report set.</text>
    </svg>
