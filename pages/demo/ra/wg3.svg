<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 920" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="#ffffff"/>
      <defs>
        <marker id="arrGrey3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#585858"/></marker>
      </defs>

      <!-- PERSONA CREATION -->
      <rect x="30" y="20" width="1140" height="230" rx="10" fill="#F4F4F4" stroke="#DADBDD" stroke-width="1.6"/>
      <text x="600" y="44" text-anchor="middle" font-size="15" font-weight="700" fill="#000000">Agent Persona Creation — requirements &amp; planning for the agent</text>
      <text x="600" y="60" text-anchor="middle" font-size="11" font-style="italic" fill="#585858">"you can't do anything below unless you know what you're going to allow up here"</text>

      <rect x="50" y="76" width="1100" height="50" rx="8" fill="#FFFFFF" stroke="#DADBDD" stroke-width="1.2"/>
      <rect x="50" y="76" width="5" height="50" fill="#F58220"/>
      <text x="600" y="97" text-anchor="middle" font-size="13" font-weight="700" fill="#000000">Agent Autonomy Level</text>
      <text x="600" y="114" text-anchor="middle" font-size="11" fill="#2C2C2C">L0 observe · L1 recommend · L2 gated act (analyst approves each block) · L3 bounded auto-act (known-bad signatures only)</text>

      <rect x="50" y="134" width="1100" height="50" rx="8" fill="#FFFFFF" stroke="#DADBDD" stroke-width="1.2"/>
      <text x="600" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#000000">Models &amp; Model Location</text>
      <text x="600" y="172" text-anchor="middle" font-size="11" fill="#2C2C2C">ML for anomaly scoring, NLP/LLM for log semantics — on-prem vs frontier is still a risk decision; no GPU fabric required</text>

      <rect x="50" y="192" width="1100" height="46" rx="8" fill="#FFFFFF" stroke="#DADBDD" stroke-width="1.2"/>
      <text x="600" y="212" text-anchor="middle" font-size="13" font-weight="700" fill="#000000">Estate Under Watch</text>
      <text x="600" y="229" text-anchor="middle" font-size="11" fill="#2C2C2C">Endpoints/EDR · identity systems · cloud IAM &amp; flows · internet edge/CDN/WAF — fused detection across all of them</text>

      <!-- ENFORCEMENT & AUDIT -->
      <rect x="30" y="270" width="1140" height="390" rx="12" fill="#FFFFFF" stroke="#F58220" stroke-width="2.2"/>
      <text x="600" y="296" text-anchor="middle" font-size="15" font-weight="800" fill="#DB7015">Access Enforcement &amp; Audit — outside agent control and influence</text>
      <text x="600" y="313" text-anchor="middle" font-size="11" font-style="italic" fill="#585858">"enforcement" means any access control — identity, certificates, zero trust — not just firewalls and ACLs</text>

      <rect x="50" y="330" width="540" height="170" rx="8" fill="#FFFFFF" stroke="#DADBDD" stroke-width="1.3" stroke-dasharray="6 4"/>
      <text x="320" y="352" text-anchor="middle" font-size="12.5" font-weight="700" fill="#000000">Pattern A — Direct (agent ⇔ agent)</text>
      <rect x="66" y="366" width="250" height="42" rx="6" fill="#F4F4F4" stroke="#DADBDD"/>
      <text x="191" y="391" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2C2C2C">Telemetry / Logs</text>
      <rect x="326" y="366" width="250" height="42" rx="6" fill="#F4F4F4" stroke="#DADBDD"/>
      <text x="451" y="391" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2C2C2C">Sources of Truth</text>
      <rect x="66" y="416" width="250" height="42" rx="6" fill="#F4F4F4" stroke="#DADBDD"/>
      <text x="191" y="441" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2C2C2C">Rulesets</text>
      <rect x="326" y="416" width="250" height="42" rx="6" fill="#F4F4F4" stroke="#DADBDD"/>
      <text x="451" y="441" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2C2C2C">Agents / MCPs</text>
      <text x="320" y="486" text-anchor="middle" font-size="10.5" font-style="italic" fill="#585858">every agent-to-agent call carries the same enforcement</text>

      <rect x="610" y="330" width="560" height="170" rx="8" fill="#FFFFFF" stroke="#DADBDD" stroke-width="1.3" stroke-dasharray="6 4"/>
      <text x="890" y="352" text-anchor="middle" font-size="12.5" font-weight="700" fill="#000000">Pattern B — Orchestrated</text>
      <rect x="630" y="368" width="520" height="60" rx="8" fill="#F4F4F4" stroke="#DADBDD"/>
      <text x="890" y="392" text-anchor="middle" font-size="12" font-weight="700" fill="#2C2C2C">Orchestrator / API Gateway</text>
      <text x="890" y="410" text-anchor="middle" font-size="10.5" fill="#585858">fronts Telemetry, Sources of Truth, Rulesets, Agents/MCPs</text>
      <text x="890" y="486" text-anchor="middle" font-size="10.5" font-style="italic" fill="#585858">the orchestrator is itself governed — references policy on every request</text>

      <text x="600" y="536" text-anchor="middle" font-size="13" font-weight="700" fill="#000000">Agent Operations Loop 1–6 (common to both patterns)</text>

      <rect x="50" y="550" width="170" height="92" rx="8" fill="#FFFFFF" stroke="#8FC73E" stroke-width="1.6"/>
      <text x="135" y="572" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">1 · Detect</text>
      <text x="135" y="590" text-anchor="middle" font-size="10.5" fill="#2C2C2C">signal</text>
      <text x="135" y="604" text-anchor="middle" font-size="10.5" fill="#2C2C2C">surfaces</text>

      <line x1="222" y1="596" x2="232" y2="596" stroke="#585858" stroke-width="1.4" marker-end="url(#arrGrey3)"/>

      <rect x="234" y="550" width="170" height="92" rx="8" fill="#FFFFFF" stroke="#8FC73E" stroke-width="1.6"/>
      <text x="319" y="572" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">2 · Investigate</text>
      <text x="319" y="590" text-anchor="middle" font-size="10.5" fill="#2C2C2C">context</text>
      <text x="319" y="604" text-anchor="middle" font-size="10.5" fill="#2C2C2C">&amp; scope</text>

      <line x1="406" y1="596" x2="416" y2="596" stroke="#585858" stroke-width="1.4" marker-end="url(#arrGrey3)"/>

      <rect x="418" y="550" width="170" height="92" rx="8" fill="#FFFFFF" stroke="#8FC73E" stroke-width="1.6"/>
      <text x="503" y="572" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">3 · Propose</text>
      <text x="503" y="590" text-anchor="middle" font-size="10.5" fill="#2C2C2C">candidate</text>
      <text x="503" y="604" text-anchor="middle" font-size="10.5" fill="#2C2C2C">action</text>

      <line x1="590" y1="596" x2="600" y2="596" stroke="#585858" stroke-width="1.4" marker-end="url(#arrGrey3)"/>

      <rect x="602" y="550" width="170" height="92" rx="8" fill="#FFFFFF" stroke="#F58220" stroke-width="1.8"/>
      <text x="687" y="570" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">4 · Decide</text>
      <text x="687" y="583" text-anchor="middle" font-size="9.5" font-weight="700" fill="#DB7015">Decide Gate</text>
      <text x="687" y="600" text-anchor="middle" font-size="10" fill="#2C2C2C">contain now vs</text>
      <text x="687" y="613" text-anchor="middle" font-size="10" fill="#2C2C2C">observe &amp; trace</text>

      <line x1="774" y1="596" x2="784" y2="596" stroke="#585858" stroke-width="1.4" marker-end="url(#arrGrey3)"/>

      <rect x="786" y="550" width="170" height="92" rx="8" fill="#FFFFFF" stroke="#F58220" stroke-width="1.8"/>
      <text x="871" y="572" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">5 · Respond</text>
      <text x="871" y="590" text-anchor="middle" font-size="10" fill="#2C2C2C">monitor→flag→</text>
      <text x="871" y="604" text-anchor="middle" font-size="10" fill="#2C2C2C">block (staged)</text>

      <line x1="958" y1="596" x2="968" y2="596" stroke="#585858" stroke-width="1.4" marker-end="url(#arrGrey3)"/>

      <rect x="970" y="550" width="170" height="92" rx="8" fill="#FFFFFF" stroke="#F58220" stroke-width="1.8"/>
      <text x="1055" y="572" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">6 · Validate</text>
      <text x="1055" y="590" text-anchor="middle" font-size="10.5" fill="#2C2C2C">&amp; learn</text>

      <text x="600" y="638" text-anchor="middle" font-size="9.5" font-style="italic" fill="#8a93a5">only Respond (5) is genuinely mutable — intelligence value may outweigh immediate blocking</text>

      <!-- Invariants -->
      <text x="600" y="686" text-anchor="middle" font-size="11.5" fill="#000000">identity air-gap (no self-promotion) · scoped service accounts · enforcement-point-only responses · governed agent/MCP reachability · change-stop &amp; observe-mode honored</text>
      <text x="600" y="704" text-anchor="middle" font-size="11.5" fill="#000000">immutable audit journal — doubles as the evidence trail: chain of custody, forensic replay, a defensible record</text>

      <!-- Legend -->
      <rect x="30" y="726" width="1140" height="96" rx="8" fill="#FFFFFF" stroke="#E8E8E8" stroke-width="1.2"/>
      <text x="46" y="748" font-size="11.5" font-weight="700" fill="#000000">Legend</text>
      <g font-size="11" fill="#2C2C2C">
        <rect x="46" y="758" width="20" height="12" rx="2" fill="#FFFFFF" stroke="#F58220" stroke-width="2"/>
        <text x="72" y="768">Orange bar — the autonomy decision, made by humans first (conservative ceiling for the SOC)</text>
        <rect x="46" y="782" width="20" height="12" rx="2" fill="#FFFFFF" stroke="#8FC73E" stroke-width="1.6"/>
        <text x="72" y="792">Green loop box — read-only, steps 1–3</text>
        <rect x="426" y="782" width="20" height="12" rx="2" fill="#FFFFFF" stroke="#F58220" stroke-width="1.8"/>
        <text x="452" y="792">Orange loop box — autonomy-gated, steps 4–6</text>
        <rect x="46" y="806" width="20" height="12" rx="2" fill="#F4F4F4" stroke="#DADBDD"/>
        <text x="72" y="816">Grey tile — a governed resource, reachable only as policy allows</text>
      </g>

      <text x="30" y="850" font-size="11.5" fill="#585858">For the SOC, the Agents/MCPs tile is how detection gets fused across silos — endpoint, identity, cloud, and edge agents correlating under</text>
      <text x="30" y="868" font-size="11.5" fill="#585858">control, including SOC ⇔ NOC coordination such as quarantining a host without tipping off the intruder.</text>
      <text x="30" y="890" font-size="11" font-style="italic" fill="#b0894a">Draft v0.6 · WG3 — prepared for vendor sessions · redrawn in ONUG design language for this report set.</text>
    </svg>
